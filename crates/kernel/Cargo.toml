[package]
name = "byte-ring-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "byte-ring-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
userspace = []
userspace-test = ["userspace"]
network = []
http = ["network", "dep:smoltcp", "byte-ring-drivers/tcp"]
qemu-test = []
qemu-vm-errors = ["qemu-test"]
qemu-divide = ["qemu-test"]
qemu-invalid-opcode = ["qemu-test"]
qemu-general-protection = ["qemu-test"]
qemu-page-fault = ["qemu-test"]
qemu-double-fault = ["qemu-test"]
qemu-panic = ["qemu-test"]

[dependencies]
byte-ring-kernel-core = { path = "../kernel-core" }
byte-ring-hal = { path = "../hal" }
byte-ring-drivers = { path = "../drivers" }
smoltcp = { workspace = true, optional = true }
