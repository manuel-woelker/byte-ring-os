[workspace]
members = ["crates/kernel", "crates/kernel-core", "crates/hal", "crates/drivers", "crates/user-demo"]
default-members = ["crates/kernel-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace.dependencies]
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "auto-icmp-echo-reply"] }
